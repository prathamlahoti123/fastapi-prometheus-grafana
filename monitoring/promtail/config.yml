server:
  # Port on which Promtail runs
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

# address to send logs to (via POST requests)
clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
# docker-logs is a custom name that will appear in Grafana
- job_name: docker-logs
  static_configs:
  - targets:
      - localhost
    labels:
      job: docker-logs
      # in this path logs from stdout of containers are stored
      # Promtail will grab the logs from this path
      __path__: /var/lib/docker/containers/*/*log

  pipeline_stages:
  - json:
      expressions:
        stream: stream
        attrs: attrs
        tag: attrs.tag
  - regex:
      expression: (?P<image_name>(?:[^|]*[^|])).(?P<container_name>(?:[^|]*[^|])).(?P<image_id>(?:[^|]*[^|])).(?P<container_id>(?:[^|]*[^|]))
      source: "tag"
  - labels:
      tag:
      image_name:
      container_name:
